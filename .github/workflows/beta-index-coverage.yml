name: Beta index coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-index-coverage-main
  cancel-in-progress: true

jobs:
  ensure-beta-indexes:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip beta-rollout]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Beta Program doorway to visible index pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          TAG = '<script src="/assets/vnv-beta-link.js" defer></script>'
          EXCLUDED_PARTS = {'.git','.github','node_modules','vendor','archive','archives','backup','backups','deprecated','private','admin','beta'}
          changed=[]; already=[]; skipped=[]
          for path in sorted(Path('.').rglob('*.html')):
              if not re.search(r'in+dex\.html$', path.name.lower()): continue
              if {p.lower() for p in path.parts} & EXCLUDED_PARTS:
                  skipped.append((str(path),'excluded-path')); continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  skipped.append((str(path),'non-utf8')); continue
              if 'vnv-beta-link.js' in text:
                  already.append(str(path)); continue
              csp=re.search(r'<meta[^>]+http-equiv=["\']Content-Security-Policy["\'][^>]+content=["\']([^"\']*)',text,re.I)
              if csp and re.search(r"(?:^|;)\s*script-src\s+'none'\s*(?:;|$)",csp.group(1),re.I):
                  skipped.append((str(path),'csp-script-none')); continue
              body=list(re.finditer(r'</body\s*>',text,re.I)); html=list(re.finditer(r'</html\s*>',text,re.I))
              if body:
                  i=body[-1].start(); updated=text[:i].rstrip()+'\n'+TAG+'\n'+text[i:]
              elif html:
                  i=html[-1].start(); updated=text[:i].rstrip()+'\n'+TAG+'\n'+text[i:]
              else:
                  updated=text.rstrip()+'\n'+TAG+'\n'
              path.write_text(updated,encoding='utf-8'); changed.append(str(path))
          lines=['# Beta Index Coverage','', 'Generated automatically by `.github/workflows/beta-index-coverage.yml`.','',f'- Added in this run: **{len(changed)}**',f'- Already covered: **{len(already)}**',f'- Skipped for an explicit reason: **{len(skipped)}**','', '## Coverage rule','', 'Visible public HTML surfaces whose filenames end in `index.html` (including `_index.html` and common `inndex.html` typos) receive the canonical `/assets/vnv-beta-link.js` doorway unless they are archived, private, administrative, the Beta destination itself, or explicitly forbid all scripts.','', 'The Beta widget sends only public hostname and pathname source metadata; never learner/family IDs, answers, form values, query strings, hashes, localStorage, report text, credentials, or medical/private form data.']
          if changed: lines+=['','## Added in this run','']+[f'- `{p}`' for p in changed]
          if skipped: lines+=['','## Skipped','']+[f'- `{p}` — {why}' for p,why in skipped]
          Path('BETA_INDEX_COVERAGE.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit generated coverage
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name "Verve N Veda Beta Coverage"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "chore(beta): ensure visible index coverage [skip beta-rollout]"
          git push
