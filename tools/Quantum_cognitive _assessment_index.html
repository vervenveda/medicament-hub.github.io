<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantum Cognitive Assessment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background:#0e0f11;
  color:#f4f1ea;
  font-family:system-ui,sans-serif;
  padding:24px;
}
h1 { color:#e0c97a; text-align:center; }
.panel {
  background:#141518;
  border:1px solid #2b2b2b;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
}
textarea {
  width:100%;
  min-height:120px;
  background:#0e0f11;
  color:#f4f1ea;
  border:1px solid #444;
  border-radius:10px;
  padding:12px;
}
button {
  margin-top:12px;
  padding:10px 20px;
  background:transparent;
  border:1px solid #c9a84e;
  color:#e0c97a;
  border-radius:8px;
  cursor:pointer;
}
button:hover {
  background:#c9a84e;
  color:#111;
}
.bar {
  height:18px;
  background:#2a2a2a;
  border-radius:9px;
  margin:6px 0;
}
.fill {
  height:100%;
  border-radius:9px;
  background:linear-gradient(90deg,#c9a84e,#e6d28c);
  text-align:right;
  font-size:0.75em;
  padding-right:6px;
  color:#111;
}
.small { font-size:0.8em; color:#aaa; }
</style>
</head>

<body>

<h1>Quantum Cognitive Assessment</h1>

<div id="panel" class="panel"></div>
<div id="question" class="panel"></div>
<div id="results" class="panel"></div>

<script>
/* =====================================================
   🧠 COGNITIVE STATE
===================================================== */
let theta = {
  logic:0.5,
  verbal:0.5,
  pattern:0.5,
  spatial:0.5
};
let confidence = {
  logic:0.7,
  verbal:0.7,
  pattern:0.7,
  spatial:0.7
};

/* =====================================================
   📚 QUESTION BANK (OPEN ENDED)
===================================================== */
const QUESTIONS = Array.from({length:25},(_,i)=>({
  text: [
    "Explain why a pattern might appear correct but still be wrong.",
    "Describe how you would test whether a rule applies universally.",
    "Explain the difference between correlation and causation.",
    "What makes an explanation robust rather than plausible?",
    "Describe a situation where intuition conflicts with logic."
  ][i%5],
  domains:{ logic:1, verbal:0.7 },
  a:1.2 + Math.random()*0.5,   // discrimination
  b:0.4 + Math.random()*0.4,   // difficulty
  c:0.15                      // guessing floor
}));

/* =====================================================
   🧪 IRT FUNCTIONS
===================================================== */
function logistic(theta,a,b,c){
  return c + (1-c)/(1+Math.exp(-a*(theta-b)));
}

/* =====================================================
   ⏱️ TIMING
===================================================== */
let startTime = performance.now();
let index = 0;

/* =====================================================
   🧠 TEXT ANALYSIS (STRUCTURAL)
===================================================== */
function analyzeText(text){
  const words = text.trim().split(/\s+/).length;
  const sentences = text.split(/[.!?]/).filter(s=>s.trim()).length;
  const connectors = (text.match(/\b(because|therefore|however|if|thus|while)\b/gi)||[]).length;
  return {
    richness: Math.min(1,(words/40)),
    structure: Math.min(1,(sentences/3)),
    causality: Math.min(1,(connectors/3))
  };
}

/* =====================================================
   🎯 RENDER
===================================================== */
function render(){
  if(index>=QUESTIONS.length) return showResults();
  startTime = performance.now();
  const q = QUESTIONS[index];
  document.getElementById("panel").innerHTML =
    `<div class="small">Question ${index+1} of ${QUESTIONS.length}</div>
     <p>${q.text}</p>`;
  document.getElementById("question").innerHTML =
    `<textarea id="response" placeholder="Explain your reasoning…"></textarea>
     <button onclick="submit()">Submit</button>`;
}

/* =====================================================
   🧠 SUBMIT
===================================================== */
function submit(){
  const q = QUESTIONS[index];
  const rt = (performance.now()-startTime)/1000;
  const text = document.getElementById("response").value;
  const analysis = analyzeText(text);

  const quality = (
    analysis.richness*0.4 +
    analysis.structure*0.3 +
    analysis.causality*0.3
  );

  for(const d in q.domains){
    const p = logistic(theta[d],q.a,q.b,q.c);
    const rtFactor = rt<4 ? 1 : rt>20 ? 0.6 : 0.85;
    const delta = (quality-p)*q.a*0.08*rtFactor;
    theta[d] = Math.max(0.05,Math.min(0.95,theta[d]+delta));
    confidence[d] = confidence[d]*0.9 + Math.abs(delta)*0.1;
  }

  index++;
  render();
}

/* =====================================================
   📊 RESULTS
===================================================== */
function showResults(){
  let html = "<h2>Cognitive Profile</h2>";
  for(const d in theta){
    const pct = Math.round(theta[d]*100);
    html += `
      <div>${d}
        <div class="bar"><div class="fill" style="width:${pct}%">${pct}%</div></div>
        <div class="small">Stability ${(confidence[d]*100).toFixed(0)}%</div>
      </div>`;
  }
  document.getElementById("panel").innerHTML = "";
  document.getElementById("question").innerHTML = "";
  document.getElementById("results").innerHTML = html;
}

render();
</script>

</body>
</html>
